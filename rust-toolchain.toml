# Pinned so every machine that builds or publishes `guss` uses the same compiler.
# There is no CI: `guss setup publish` runs on a person's laptop, so this file is
# the only thing keeping release builds reproducible.
#
# The musl target is what `setup publish` produces — a static binary, so one
# artifact runs on any glibc version the team happens to have.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
